services:
  stt-api:
    build: .
    ports: ["4321:8000"]
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]

  llama-refine:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports: ["1234:8080"]
    entrypoint: /entrypoint-refine.sh
    command:
      - --port
      - "8080"
      - --host
      - "0.0.0.0"
      - --n-gpu-layers
      - "-1"
      - --main-gpu
      - "0"
      - --parallel
      - "8"
      - --cont-batching
      - --flash-attn
      - "on"
      - --ctx-size
      - "32768"
    volumes:
      - ./models:/models
      - ./entrypoint-refine.sh:/entrypoint-refine.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN:-}
