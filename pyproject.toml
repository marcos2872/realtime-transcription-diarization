[project]
name = "stt-api"
version = "0.1.0"
description = "API remota de transcrição (Whisper + refinamento via LLM)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "faster-whisper>=1.0.3",
    "openai>=1.0.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=0.2.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.9",  # pyannote v4 exige torch 2.9+ (torchaudio 2.8 não combina com torch 2.9)
    "torchaudio>=2.9",  # idem
    "huggingface-hub>=0.24.0",  # HF_TOKEN para download autenticado
    "requests>=2.28.0",
    "pyannote.audio>=4,<5",  # v4: I/O via torchcodec, token= em vez de use_auth_token
    # Runtime CUDA 12 para o ctranslate2 (engine do faster-whisper), que
    # exige libcublas.so.12 — o torch 2.9+ traz pacotes cu13 (.so.13).
    # Pacotes têm nomes distintos (-cu12 vs sem sufixo), então coexistem.
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",  # testes de domínio + use cases (sem GPU/rede)
]
