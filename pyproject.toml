[project]
name = "stt-api"
version = "0.1.0"
description = "API remota de transcrição (Whisper + refinamento via LLM)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "faster-whisper>=1.0.3",
    "openai>=1.0.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=0.2.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.2,<2.9",  # pyannote 3.x usa torchaudio.AudioMetaData (removido no 2.9)
    "torchaudio>=2.2,<2.9",  # idem — não subir para 2.9+ sem migrar pyannote para v4
    "huggingface-hub>=0.24.0",  # HF_TOKEN para download autenticado
    "requests>=2.28.0",
    "pyannote.audio>=3.1.0,<4",  # v4+ muda API do Pipeline
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",  # testes de domínio + use cases (sem GPU/rede)
]
